<style>
:root{
  --ocean-deep:#0D536B; --ocean-blue:#176F88; --teal:#45B9AC; --seafoam:#BCECE5;
  --yellow:#FFC52F; --orange:#F49A34; --mist:#EAF6FA; --white:#fff;
  --text:#0D536B; --text-2:#54747C; --line:#DCEEF4; --line-2:#EAF6FA;
  --ok:#45B9AC; --warn:#F49A34; --bad:#E0556B; --info:#176F88;
  --sh:0 2px 8px rgba(13,83,107,.08); --sh-md:0 6px 18px rgba(13,83,107,.12); --sh-lg:0 14px 34px rgba(13,83,107,.18);
  --rad:16px; --rad-sm:10px; --rad-lg:22px; --rad-pill:999px;
  --maxw:1120px; --side-w:248px;
  --fhead:'Plus Jakarta Sans',system-ui,sans-serif; --fbody:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--fbody);background:var(--mist);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--fhead);color:var(--ocean-deep);line-height:1.2;margin:0 0 .4em;font-weight:800;letter-spacing:-.01em}
h1{font-size:clamp(1.5rem,4.5vw,2.1rem)} h2{font-size:clamp(1.25rem,3.5vw,1.6rem)} h3{font-size:1.1rem}
p{margin:0 0 .7em;color:var(--text-2)} .lead{color:var(--text-2);font-size:1rem}
a{color:var(--ocean-blue);text-decoration:none} a:hover{text-decoration:underline}
small{color:var(--text-2)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{max-width:100%;height:auto}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}

.shell{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--side-w);background:var(--ocean-deep);color:#fff;display:flex;flex-direction:column;padding:18px 14px;z-index:50;transform:translateX(-100%);transition:transform .3s}
.sidebar.open{transform:none}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--ocean-blue));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--sh-md);flex-shrink:0}
.brand .logo svg{width:24px;height:24px}
.brand .bt{font-family:var(--fhead);font-weight:800;font-size:1.05rem;line-height:1.1;color:#fff}
.brand .bs{font-size:.66rem;color:var(--seafoam);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.side-nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.side-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:rgba(255,255,255,.78);font-weight:600;font-size:.92rem;transition:.2s;cursor:pointer}
.side-link i{width:20px;text-align:center;font-size:1rem}
.side-link:hover{background:rgba(255,255,255,.08);color:#fff;text-decoration:none}
.side-link.active{background:rgba(255,255,255,.14);color:#fff}
.side-link.active i{color:var(--yellow)}
.side-ai{margin:14px 8px;background:linear-gradient(135deg,var(--teal),var(--ocean-blue));border-radius:14px;padding:14px;color:#fff;display:flex;align-items:center;gap:10px;font-weight:700;box-shadow:var(--sh-md);transition:.2s;cursor:pointer}
.side-ai:hover{text-decoration:none;transform:translateY(-2px)}
.side-ai i{font-size:1.2rem}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:4px}
.side-foot .side-link{padding:9px 14px;font-size:.85rem}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:var(--sh);display:flex;align-items:center;gap:10px;padding:10px 14px}
.topbar .tb-brand{display:flex;align-items:center;gap:8px;font-family:var(--fhead);font-weight:800;color:var(--ocean-deep);font-size:1.05rem}
.topbar .tb-brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--ocean-blue));display:flex;align-items:center;justify-content:center;color:#fff}
.topbar .tb-brand .logo svg{width:18px;height:18px}
.topbar .spacer{flex:1}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;background:var(--mist);color:var(--ocean-deep);display:flex;align-items:center;justify-content:center;font-size:1.05rem;transition:.2s;cursor:pointer}
.icon-btn:hover{background:var(--seafoam)}
.icon-btn b{font-family:var(--fhead);font-weight:800;font-size:.74rem}
.menu-toggle{display:flex}

.content{padding:18px 16px 96px;max-width:var(--maxw);margin:0 auto;width:100%}
.view{display:none;animation:fade .4s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ocean-deep);color:#fff;padding:11px 22px;border-radius:var(--rad-pill);font-weight:700;font-size:.92rem;transition:.2s;border:none;cursor:pointer;text-decoration:none;font-family:var(--fhead)}
.btn:hover{background:var(--ocean-blue);transform:translateY(-2px);box-shadow:var(--sh-md);text-decoration:none}
.btn:active{transform:translateY(0)}
.btn-teal{background:var(--teal)} .btn-teal:hover{background:#3aa89c}
.btn-yellow{background:var(--yellow);color:var(--ocean-deep)} .btn-yellow:hover{background:#ffb80f}
.btn-orange{background:var(--orange)} .btn-orange:hover{background:#e88c24}
.btn-ghost{background:transparent;color:var(--ocean-deep);border:2px solid var(--line)} .btn-ghost:hover{background:var(--mist);border-color:var(--teal)}
.btn-light{background:#fff;color:var(--ocean-deep);border:1px solid var(--line)} .btn-light:hover{background:var(--mist)}
.btn-block{width:100%} .btn-sm{padding:8px 16px;font-size:.82rem} .btn-lg{padding:14px 30px;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}

.card{background:var(--white);border-radius:var(--rad);box-shadow:var(--sh);border:1px solid var(--line);transition:.25s}
.card:hover{box-shadow:var(--sh-md);transform:translateY(-3px)}
.card-pad{padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.section-head{margin-bottom:16px}
.section-head .kicker{display:inline-block;background:var(--seafoam);color:var(--ocean-blue);font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:var(--rad-pill);margin-bottom:8px}
.section-head h2{margin-bottom:4px}
.section-head .lead{margin:0}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--rad-pill);font-size:.7rem;font-weight:700}
.badge.verified{background:rgba(69,185,172,.16);color:#2a8f84}
.badge.demo{background:rgba(255,197,47,.22);color:#a87a00}
.badge.pending{background:rgba(244,154,52,.18);color:#b56a18}
.badge.ok{background:rgba(69,185,172,.16);color:#2a8f84}
.badge.warn{background:rgba(244,154,52,.18);color:#b56a18}
.badge.bad{background:rgba(224,85,107,.16);color:#b23a52}
.badge.info{background:rgba(23,111,136,.12);color:var(--ocean-blue)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rad-pill);background:var(--white);border:1px solid var(--line);color:var(--text-2);font-weight:600;font-size:.82rem;cursor:pointer;transition:.2s;white-space:nowrap}
.chip:hover{border-color:var(--teal);color:var(--ocean-deep)}
.chip.active{background:var(--ocean-deep);color:#fff;border-color:var(--ocean-deep)}

input,select,textarea{font-family:inherit;font-size:.95rem;color:var(--text);background:var(--white);border:1.5px solid var(--line);border-radius:var(--rad-sm);padding:10px 12px;width:100%;transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(69,185,172,.15)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-weight:700;font-size:.82rem;color:var(--ocean-deep);margin-bottom:5px;font-family:var(--fhead)}

.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(13,83,107,.08);display:flex;z-index:45;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--text-2);font-size:.68rem;font-weight:600;transition:.2s;cursor:pointer;position:relative}
.bottomnav a i{font-size:1.25rem}
.bottomnav a.active{color:var(--ocean-deep)}
.bottomnav a.active i{color:var(--teal)}
.bottomnav a.active::before{content:"";position:absolute;top:0;width:32px;height:3px;background:var(--yellow);border-radius:0 0 6px 6px}

.fab{position:fixed;right:16px;bottom:78px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--yellow),var(--orange));color:var(--ocean-deep);box-shadow:var(--sh-lg);display:flex;align-items:center;justify-content:center;z-index:46;transition:.2s;border:none;cursor:pointer}
.fab:hover{transform:scale(1.08)}
.fab i{font-size:1.4rem}

.hero{position:relative;border-radius:var(--rad-lg);overflow:hidden;background:linear-gradient(135deg,var(--ocean-deep),var(--ocean-blue));color:#fff;padding:26px 22px;margin-bottom:18px;box-shadow:var(--sh-md)}
.hero .wave-bg{position:absolute;inset:0;opacity:.18;background:radial-gradient(circle at 85% 20%,var(--teal),transparent 55%)}
.hero .mascot{position:absolute;right:10px;bottom:-6px;width:96px;opacity:.92;animation:swim 4s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.hero-inner{position:relative;z-index:2;max-width:560px}
.hero .tag{display:inline-block;background:rgba(255,197,47,.22);color:var(--yellow);border:1px solid rgba(255,197,47,.4);padding:4px 12px;border-radius:var(--rad-pill);font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.hero h1{color:#fff;margin-bottom:8px}
.hero p{color:rgba(255,255,255,.92);margin-bottom:14px;font-size:.96rem}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}

.welcome{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh)}
.welcome .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--ocean-blue));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;flex-shrink:0}
.welcome h3{margin:0 0 2px;font-size:1.05rem}
.welcome p{margin:0;font-size:.82rem}

.prog-card{background:linear-gradient(135deg,var(--ocean-blue),var(--ocean-deep));color:#fff;border-radius:var(--rad);padding:18px;box-shadow:var(--sh-md);margin-bottom:14px}
.prog-card .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-card .lvl{font-family:var(--fhead);font-weight:800;font-size:1.1rem}
.prog-card .xp{background:rgba(255,255,255,.18);padding:3px 12px;border-radius:var(--rad-pill);font-weight:700;font-size:.82rem}
.prog-bar{height:9px;background:rgba(255,255,255,.22);border-radius:var(--rad-pill);overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:var(--rad-pill);transition:width .6s}
.prog-stats{display:flex;gap:10px;margin-top:12px}
.prog-stats .st{flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:8px;text-align:center}
.prog-stats .st b{display:block;font-size:1.15rem;font-family:var(--fhead)}
.prog-stats .st span{font-size:.66rem;opacity:.85}

.feat-card{background:var(--white);border-radius:var(--rad);padding:18px;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;transition:.25s;display:flex;flex-direction:column;height:100%;position:relative;overflow:hidden}
.feat-card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--teal)}
.feat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent,var(--teal))}
.feat-card .fi{width:48px;height:48px;border-radius:14px;background:var(--accent-bg,var(--seafoam));color:var(--accent,var(--ocean-deep));display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:10px;transition:.3s}
.feat-card:hover .fi{transform:scale(1.1) rotate(-4deg)}
.feat-card h3{color:var(--ocean-deep);margin-bottom:3px}
.feat-card .fsub{font-size:.74rem;font-weight:700;color:var(--accent,var(--ocean-blue));text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.feat-card .fd{font-size:.84rem;color:var(--text-2);margin-bottom:12px}
.feat-card .fgo{margin-top:auto;color:var(--ocean-blue);font-weight:700;font-size:.82rem;display:flex;align-items:center;gap:6px}

.story-card{background:var(--white);border-radius:var(--rad);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;transition:.25s;display:flex;flex-direction:column}
.story-card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--teal)}
.story-thumb{height:120px;background:var(--g,linear-gradient(135deg,var(--ocean-blue),var(--teal)));position:relative;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-size:2rem}
.story-thumb .type-pill{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.9);color:var(--ocean-deep);padding:3px 9px;border-radius:var(--rad-pill);font-size:.66rem;font-weight:700}
.story-body{padding:12px 14px;flex:1;display:flex;flex-direction:column}
.story-body h3{font-size:.96rem;margin-bottom:3px}
.story-body .cat{font-size:.72rem;color:var(--ocean-blue);font-weight:700;margin-bottom:5px}
.story-body .desc{font-size:.8rem;color:var(--text-2);margin-bottom:8px;flex:1}
.story-body .meta{display:flex;align-items:center;justify-content:space-between}

.story-detail .sd-img{height:200px;border-radius:var(--rad);background:var(--g,linear-gradient(135deg,var(--ocean-blue),var(--teal)));display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-size:3rem;margin-bottom:14px;position:relative}
.story-detail .sd-img .bookmark{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ocean-deep);display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;border:none}
.story-detail .sd-img .bookmark.on{background:var(--yellow);color:var(--ocean-deep)}
.audio-player{background:var(--mist);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:14px}
.audio-player .ap-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.audio-player .play-btn{width:46px;height:46px;border-radius:50%;background:var(--ocean-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;transition:.2s;cursor:pointer;border:none}
.audio-player .play-btn:hover{background:var(--ocean-blue)}
.audio-player .ap-info{flex:1}
.audio-player .ap-info b{display:block;font-family:var(--fhead);font-size:.9rem}
.audio-player .ap-info span{font-size:.74rem;color:var(--text-2)}
.audio-bar{height:7px;background:var(--line);border-radius:var(--rad-pill);overflow:hidden;cursor:pointer;position:relative}
.audio-fill{height:100%;width:0;background:var(--teal);border-radius:var(--rad-pill);transition:width .15s linear}
.audio-demo-note{font-size:.74rem;color:var(--orange);margin-top:8px;display:flex;align-items:center;gap:6px}
.transcript{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:var(--rad-sm);padding:14px;margin-bottom:14px}
.transcript h4{color:var(--ocean-deep);margin-bottom:8px;font-size:.95rem}
.transcript p{font-size:.88rem;font-style:italic;color:var(--text-2)}
.src-info{background:var(--mist);border-radius:var(--rad-sm);padding:12px;font-size:.82rem;color:var(--text-2)}
.src-info b{color:var(--ocean-deep)}

.ai-sheet{position:fixed;inset:0;z-index:60;background:rgba(13,83,107,.5);display:none;opacity:0;transition:opacity .25s}
.ai-sheet.open{display:block;opacity:1}
.ai-panel{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:460px;background:var(--mist);display:flex;flex-direction:column;transform:translateX(30px);transition:transform .3s}
.ai-sheet.open .ai-panel{transform:none}
.ai-head{background:linear-gradient(135deg,var(--ocean-deep),var(--ocean-blue));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
.ai-head .ai-av{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.ai-head b{font-family:var(--fhead);font-size:1rem;display:block}
.ai-head span{font-size:.72rem;opacity:.85}
.ai-head .close{margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.ai-modes{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--white);border-bottom:1px solid var(--line)}
.ai-mode{flex-shrink:0;padding:6px 12px;border-radius:var(--rad-pill);background:var(--mist);border:1px solid var(--line);color:var(--text-2);font-size:.76rem;font-weight:700;cursor:pointer;transition:.2s;white-space:nowrap}
.ai-mode.active{background:var(--ocean-deep);color:#fff;border-color:var(--ocean-deep)}
.ai-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;font-size:.88rem;line-height:1.5;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{background:var(--white);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:4px;align-self:flex-start}
.msg.user{background:var(--ocean-deep);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg.bot .src-card{margin-top:8px;background:var(--mist);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.8rem;color:var(--ocean-blue);cursor:pointer;display:flex;align-items:center;gap:8px}
.msg.bot .src-card:hover{background:var(--seafoam)}
.msg.bot .followups{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.msg.bot .followups button{background:var(--seafoam);color:var(--ocean-blue);border:none;padding:6px 12px;border-radius:var(--rad-pill);font-size:.76rem;font-weight:700;cursor:pointer}
.msg.bot .followups button:hover{background:var(--teal);color:#fff}
.typing{align-self:flex-start;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;gap:4px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.ai-suggest{padding:0 14px 8px;display:flex;flex-direction:column;gap:6px}
.ai-suggest button{text-align:left;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:.82rem;color:var(--text);font-weight:600;cursor:pointer;transition:.2s}
.ai-suggest button:hover{border-color:var(--teal);background:var(--mist)}
.ai-input{padding:10px 12px;background:var(--white);border-top:1px solid var(--line);display:flex;gap:8px}
.ai-input input{flex:1}
.ai-input button{width:42px;height:42px;border-radius:12px;background:var(--ocean-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;border:none}
.ai-input button:hover{background:var(--ocean-blue)}

.level{background:var(--white);border-radius:var(--rad);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px;animation:slideUp .45s ease both}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.level.locked{opacity:.6}
.level-head{padding:14px 16px;display:flex;align-items:center;gap:12px;background:var(--mist);border-left:5px solid var(--teal)}
.level.locked .level-head{border-left-color:var(--line)}
.level-head .ln{width:42px;height:42px;border-radius:12px;background:var(--ocean-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fhead);font-weight:800;font-size:1.1rem}
.level.locked .level-head .ln{background:var(--line);color:var(--text-2)}
.level-head h3{margin:0;font-size:1rem}
.level-head .ld{font-size:.78rem;color:var(--text-2);margin:0}
.level-head .lst{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--teal)}
.level-body{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--rad-sm);background:var(--white);cursor:pointer;transition:.2s}
.mission:hover{border-color:var(--teal);background:var(--mist)}
.mission .mi{width:32px;height:32px;border-radius:50%;background:var(--seafoam);color:var(--ocean-blue);display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.mission.done .mi{background:var(--teal);color:#fff;animation:popCheck .4s ease}
@keyframes popCheck{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.mission .mt{flex:1}
.mission .mt b{font-size:.86rem;color:var(--ocean-deep);font-family:var(--fhead)}
.mission .mt span{display:block;font-size:.72rem;color:var(--text-2);margin-top:2px}
.mission .mchk{color:var(--text-2)} .mission.done .mchk{color:var(--teal)}

.quiz-q{background:var(--white);border-radius:var(--rad);border:1px solid var(--line);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.quiz-q .qmeta{font-size:.74rem;color:var(--ocean-blue);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.quiz-q .qtext{font-family:var(--fhead);font-size:1.05rem;color:var(--ocean-deep);margin-bottom:14px;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--rad-sm);background:var(--white);margin-bottom:8px;font-size:.9rem;color:var(--text);cursor:pointer;transition:background .15s,border-color .15s,transform .12s;font-family:var(--fbody)}
.opt:hover:not(.disabled){border-color:var(--teal);background:var(--mist)}
.opt:active:not(.disabled){transform:scale(.99)}
.opt.correct{border-color:var(--teal);background:rgba(69,185,172,.14);color:#2a8f84;font-weight:700;animation:popCorrect .4s ease}
@keyframes popCorrect{0%{transform:scale(1)}35%{transform:scale(1.05);box-shadow:0 0 0 6px rgba(69,185,172,.25)}100%{transform:scale(1)}}
.opt.wrong{border-color:var(--bad);background:rgba(224,85,107,.12);color:#b23a52;animation:shake .5s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.opt.disabled{cursor:default}
.match-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.match-row select{flex:1}
.match-row .arrow{color:var(--text-2)}
.quiz-fb{margin-top:12px;padding:12px;border-radius:var(--rad-sm);font-size:.85rem;display:none}
.quiz-fb.show{display:block;animation:fade .3s ease}
.quiz-fb.ok{background:rgba(69,185,172,.12);color:#2a8f84;border-left:4px solid var(--teal)}
.quiz-fb.no{background:rgba(224,85,107,.1);color:#b23a52;border-left:4px solid var(--bad)}
.quiz-fb b{display:block;margin-bottom:3px;font-family:var(--fhead)}
.quiz-prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.quiz-prog .qpbar{flex:1;height:8px;background:var(--line);border-radius:var(--rad-pill);overflow:hidden}
.quiz-prog .qpfill{height:100%;background:var(--teal);border-radius:var(--rad-pill);transition:width .4s}
.quiz-prog .qptext{font-size:.78rem;font-weight:700;color:var(--text-2)}

.scenario-card{background:var(--white);border-radius:var(--rad);border:1px solid var(--line);box-shadow:var(--sh);padding:18px}
.scenario-card .sc-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(224,85,107,.12);color:var(--bad);padding:4px 12px;border-radius:var(--rad-pill);font-size:.72rem;font-weight:800;margin-bottom:10px}
.scenario-card .sc-sit{background:var(--mist);border-left:4px solid var(--orange);border-radius:var(--rad-sm);padding:14px;margin-bottom:14px;font-size:.92rem;color:var(--text)}

.result-hero{text-align:center;padding:24px;background:linear-gradient(135deg,var(--ocean-deep),var(--ocean-blue));color:#fff;border-radius:var(--rad-lg);margin-bottom:16px;animation:slideUp .5s ease both}
.result-hero .score-ring{width:110px;height:110px;border-radius:50%;border:6px solid rgba(255,255,255,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 12px;animation:popCorrect .6s ease}
.result-hero .score-ring b{font-size:2rem;font-family:var(--fhead);line-height:1}
.result-hero .score-ring span{font-size:.7rem;opacity:.85}
.result-hero h2{color:#fff} .result-hero p{color:rgba(255,255,255,.9)}

.badge-tile{background:var(--white);border:1px solid var(--line);border-radius:var(--rad);padding:16px;text-align:center;box-shadow:var(--sh);transition:.25s;height:100%}
.badge-tile.earned{border-color:var(--yellow);background:linear-gradient(180deg,rgba(255,197,47,.12),var(--white));animation:popCorrect .5s ease}
.badge-tile.locked{opacity:.5;filter:grayscale(.6)}
.badge-tile .bi{width:56px;height:56px;border-radius:50%;background:var(--mist);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--ocean-blue);margin:0 auto 8px}
.badge-tile.earned .bi{background:linear-gradient(135deg,var(--yellow),var(--orange));color:var(--ocean-deep)}
.badge-tile b{display:block;font-size:.82rem;font-family:var(--fhead);color:var(--ocean-deep)}
.badge-tile span{font-size:.7rem;color:var(--text-2)}

.tb-challenge{background:linear-gradient(135deg,var(--teal),var(--ocean-blue));color:#fff;border-radius:var(--rad-lg);padding:20px;margin-bottom:16px;box-shadow:var(--sh-md)}
.tb-challenge .ctag{display:inline-block;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:var(--rad-pill);font-size:.72rem;font-weight:800;margin-bottom:8px}
.tb-challenge h2{color:#fff} .tb-challenge p{color:rgba(255,255,255,.92)}
.ctype-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.ctype{background:var(--white);border:1.5px solid var(--line);border-radius:var(--rad);padding:14px;text-align:center;cursor:pointer;transition:.2s}
.ctype:hover{border-color:var(--teal);transform:translateY(-2px)}
.ctype.active{border-color:var(--ocean-deep);background:var(--mist)}
.ctype i{font-size:1.4rem;color:var(--ocean-blue);margin-bottom:6px}
.ctype b{display:block;font-size:.82rem;font-family:var(--fhead);color:var(--ocean-deep)}
.ctype span{font-size:.7rem;color:var(--text-2)}
.voice-ui{background:var(--mist);border:1px dashed var(--teal);border-radius:var(--rad);padding:16px;text-align:center;margin-bottom:14px}
.voice-ui .mic{width:64px;height:64px;border-radius:50%;background:var(--white);border:2px solid var(--teal);color:var(--teal);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 8px;cursor:pointer;transition:.2s}
.voice-ui .mic:hover{background:var(--teal);color:#fff}
.voice-ui .mic.rec{background:var(--bad);color:#fff;border-color:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,85,107,.4)}50%{box-shadow:0 0 0 12px rgba(224,85,107,0)}}
.voice-ui .vn{font-size:.78rem;color:var(--orange)}
.activity-card{background:var(--white);border:1px solid var(--line);border-radius:var(--rad-sm);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.activity-card i{color:var(--teal);font-size:1.1rem}
.activity-card b{font-size:.86rem;color:var(--ocean-deep);font-family:var(--fhead)}
.activity-card span{font-size:.76rem;color:var(--text-2);display:block}

.contrib-item{background:var(--white);border:1px solid var(--line);border-radius:var(--rad);padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--sh)}
.contrib-item .ci{width:40px;height:40px;border-radius:10px;background:var(--seafoam);color:var(--ocean-blue);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.contrib-item .ct{flex:1}
.contrib-item .ct b{font-family:var(--fhead);color:var(--ocean-deep);font-size:.92rem}
.contrib-item .ct span{font-size:.76rem;color:var(--text-2);display:block;margin-bottom:5px}
.validation-flow{background:var(--mist);border-radius:var(--rad);padding:14px;margin-top:14px}
.validation-flow h4{color:var(--ocean-deep);margin-bottom:10px;font-size:.92rem}
.vf-steps{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.vf-step{flex:1;min-width:80px;text-align:center;padding:10px 6px;border-radius:10px;background:var(--white);border:1px solid var(--line);font-size:.72rem;font-weight:700;color:var(--text-2)}
.vf-step.active{background:var(--ocean-deep);color:#fff;border-color:var(--ocean-deep)}
.vf-arrow{color:var(--text-2);font-size:.7rem}

.status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rad-pill);font-weight:700;font-size:.78rem}
.status-pill.online{background:rgba(69,185,172,.16);color:#2a8f84}
.status-pill.offline{background:rgba(224,85,107,.14);color:#b23a52}
.toggle{position:relative;width:46px;height:26px;background:var(--line);border-radius:var(--rad-pill);cursor:pointer;transition:.2s;flex-shrink:0}
.toggle.on{background:var(--teal)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on::after{left:23px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row b{font-family:var(--fhead);color:var(--ocean-deep);font-size:.92rem}
.set-row span{font-size:.78rem;color:var(--text-2)}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ocean-deep);color:#fff;padding:11px 20px;border-radius:var(--rad-pill);font-size:.84rem;font-weight:600;z-index:90;opacity:0;transition:.3s;box-shadow:var(--sh-lg);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.prof-head{text-align:center;padding:22px;background:linear-gradient(135deg,var(--ocean-deep),var(--ocean-blue));color:#fff;border-radius:var(--rad-lg);margin-bottom:16px}
.prof-head .pa{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 10px}
.prof-head h2{color:#fff;margin-bottom:2px} .prof-head p{color:rgba(255,255,255,.85);font-size:.85rem;margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat-grid .stat{background:var(--white);border:1px solid var(--line);border-radius:var(--rad);padding:14px;text-align:center;box-shadow:var(--sh)}
.stat-grid .stat b{display:block;font-size:1.5rem;font-family:var(--fhead);color:var(--ocean-deep)}
.stat-grid .stat span{font-size:.74rem;color:var(--text-2)}

.empty{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty i{font-size:2.4rem;color:var(--line);margin-bottom:10px}
.empty b{display:block;font-family:var(--fhead);color:var(--ocean-deep);margin-bottom:4px}

.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--ocean-blue);font-weight:700;font-size:.85rem;margin-bottom:12px;cursor:pointer}
.back-link:hover{color:var(--ocean-deep);text-decoration:none}

.insight{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--yellow);border-radius:var(--rad);padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.insight .it{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.insight .it i{color:var(--yellow)} .insight .it b{font-family:var(--fhead);color:var(--ocean-deep);font-size:.95rem}
.insight p{margin:0;font-size:.86rem;color:var(--text-2)}

@media(min-width:900px){
  .sidebar{transform:none;position:sticky;top:0;height:100vh}
  .main{margin-left:var(--side-w)}
  .topbar .menu-toggle,.bottomnav,.fab{display:none}
  .content{padding:24px 28px 40px}
}
@media(max-width:899px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}.ctype-grid{grid-template-columns:repeat(2,1fr)}.hero .mascot{display:none}.content{padding:14px 12px 92px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0D536B 0%,#176F88 60%,#0D536B 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;transition:opacity .6s ease,visibility .6s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-logo{max-width:min(62vw,290px);max-height:40vh;width:auto;height:auto;filter:drop-shadow(0 10px 26px rgba(0,0,0,.4));animation:splashIn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes splashIn{0%{opacity:0;transform:translateY(20px) scale(.9)}60%{opacity:1}100%{opacity:1;transform:none}}
.splash-word{font-family:var(--fhead);font-weight:800;color:#fff;font-size:clamp(1.4rem,5.5vw,2rem);letter-spacing:.04em;animation:splashIn 1s .15s both}
.splash-word b{color:#FFC52F}
.splash-tag{color:rgba(255,255,255,.82);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;animation:splashIn 1s .3s both}
.splash-ripple{margin-top:4px;width:64px;height:6px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden;position:relative}
.splash-ripple::after{content:"";position:absolute;inset:0;width:42%;background:linear-gradient(90deg,transparent,#FFC52F,transparent);animation:rippleLoad 1.1s infinite}
@keyframes rippleLoad{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</head>

{id:'s1',cat:'Smong Stories',type:'Story',icon:'fa-water',verified:'Community Verified',g:'linear-gradient(135deg,#176F88,#45B9AC)',
title:{en:'What Is Smong?',id:'Apa Itu Smong?'},
short:{en:'The local tsunami wisdom of the Simeulue people, passed orally for generations.',id:'Kearifan tsunami lokal masyarakat Simeulue, diwariskan lisan lintas generasi.'},
context:{en:'Smong is a word in the Devayan language of Simeulue Island (Aceh, Indonesia) that refers to knowledge of tsunamis: if a strong earthquake is felt and the sea suddenly recedes, a great wave is coming and everyone must run to high ground immediately.',id:'Smong adalah kata dalam bahasa Devayan di Pulau Simeulue (Aceh, Indonesia) yang mengacu pada pengetahuan tsunami: jika gempa kuat terasa dan laut tiba-tiba surut, gelombang besar akan datang dan semua orang harus segera lari ke tanah tinggi.'},
story:{en:'For generations, the people of Simeulue have carried a single, powerful lesson in their oral traditions: when the earth shakes hard and the ocean pulls away from the shore, do not wait — run uphill. This wisdom, called "Smong", is shared through stories, songs, and the guidance of elders. During the 2004 Indian Ocean tsunami, this inherited knowledge is widely credited with saving many lives on Simeulue, where casualties were remarkably low compared to other coastal areas. Smong is a living example of how local cultural memory can protect a community.',id:'Lintas generasi, masyarakat Simeulue memegang satu pelajaran kuat dalam tradisi lisan mereka: saat bumi getar keras dan laut surut dari pantai, jangan tunda — lari naik. Kearifan ini, bernama "Smong", dibagikan lewat cerita, lagu, dan bimbingan tetua. Saat tsunami Samudra Hindia 2004, pengetahuan warisan ini banyak dipuji menyelamatkan nyawa di Simeulue, yang korban jauh lebih sedikit dibanding wilayah pesisir lain. Smong adalah contoh nyata bagaimana memori budaya lokal melindungi komunitas.'},
transcript:{en:'"Smong teaches us: when the ground trembles and the sea disappears, the wave follows. Do not stop for belongings. Run to high ground — now."',id:'"Smong mengajarkan: saat bumi getar dan laut menghilang, gelombang menyusul. Jangan hentikan demi barang. Lari ke tanah tinggi — sekarang."'},
source:{en:'Community oral tradition of Simeulue; documented in tsunami-preparedness literature. Sample text for prototype demonstration.',id:'Tradisi lisan komunitas Simeulue; terdokumentasi dalam literatur kesiapsiagaan tsunami. Teks contoh untuk demonstrasi prototipe.'}},
{id:'s2',cat:'Nandong Smong',type:'Song / Chant',icon:'fa-music',verified:'Community Verified',g:'linear-gradient(135deg,#0D536B,#176F88)',
title:{en:'Nandong Smong',id:'Nandong Smong'},
short:{en:'A chanted oral tradition used to pass Smong knowledge through verse and rhythm.',id:'Tradisi lisan bersahut-sahutan untuk meneruskan pengetahuan Smong lewat bait dan irama.'},
context:{en:'Nandong is a form of chanted oral expression in Acehnese and Simeulue culture, historically used to share news, values, and warnings — including the teachings of Smong.',id:'Nandong adalah bentuk ekspresi lisan bersahut-sahutan dalam budaya Aceh dan Simeulue, dahulu dipakai menyebarkan berita, nilai, dan peringatan — termasuk ajaran Smong.'},
story:{en:'Before written records and phones, knowledge traveled by voice. Nandong — rhythmic chanting — carried warnings, history, and moral lessons from elders to children. A Nandong about Smong would describe the signs of danger: the long shaking, the retreating sea, the need to flee uphill. Set to a memorable rhythm, the lesson stayed with listeners for life. This is how a community without modern early-warning systems kept itself prepared across generations.',id:'Sebelum catatan tulis dan telepon, pengetahuan menempuh lewat suara. Nandong — sahut-sahutan berirama — membawa peringatan, sejarah, dan pelajaran budi dari tetua ke anak. Nandong tentang Smong menggambarkan tanda bahaya: getaran panjang, laut surut, dan kewajiban lari naik. Dengan irama yang mudah diingat, pelajaran melekat seumur hidup. Begitulah komunitas tanpa sistem peringatan modern tetap siaga lintas generasi.'},
transcript:{en:'"Listen, child: the sea that runs away will return in anger. Smong comes — climb the hill, do not look back."',id:'"Dengar, nak: laut yang lari akan kembali dengan marah. Smong datang — naik ke bukit, jangan menoleh."'},
source:{en:'Acehnese / Simeulue oral chant tradition. Sample demonstration content.',id:'Tradisi sahut-sahutan lisan Aceh/Simeulue. Konten contoh demonstrasi.'}},
{id:'s3',cat:'Stories from Simeulue',type:'Oral Account',icon:'fa-user-clock',verified:'Pending Verification',g:'linear-gradient(135deg,#45B9AC,#BCECE5)',
title:{en:'Stories from the Elders',id:'Cerita Para Tetua'},
short:{en:'First-hand memories of elders who lived through tsunami events and teach the young.',id:'Ingatan langsung tetua yang mengalami peristiwa tsunami dan mengajar anak muda.'},
context:{en:'Elders on Simeulue hold living memory of past tsunamis. Their accounts — where people ran, what the sea did, who survived — are the heart of Smong transmission.',id:'Tetua di Simeulue memegang memori hidup tsunami masa lalu. Kesaksian mereka — ke mana orang lari, apa yang dilaut, siapa selamat — adalah jantung penularan Smong.'},
story:{en:'Grandfather sits with the children under the coconut palms and tells of the day the sea left the beach. "We saw the fish flopping on bare sand," he says, "and our grandmothers cried: Smong! Run!" He remembers the route his family took up the hill, and the sound of the water that followed. These stories are not entertainment — they are rehearsal. Every telling prepares the next generation to act without hesitation.',id:'Kakek duduk bersama anak-anak di bawah pohon kelapa, bercerita tentang hari laut meninggalkan pantai. "Kita lihat ikan terjerembap di pasir," katanya, "dan nenek kita berteriak: Smong! Lari!" Ia ingat rute keluarganya naik bukit, dan suara air yang menyusul. Cerita ini bukan hiburan — ini latihan. Tiap cerita membekali generasi berikutnya untuk bertindak tanpa ragu.'},
transcript:{en:'"I was a boy. The water took the lower houses. We ran, and we lived. Remember the way up."',id:'"Saya masih kecil. Air mel rumah bawah. Kami lari, dan kami hidup. Ingat jalan ke atas."'},
source:{en:'Illustrative elder account. Marked Pending Verification until reviewed by community knowledge holders.',id:'Kesaksian tetua ilustratif. Berstatus menunggu verifikasi hingga ditinjau pemegang pengetahuan komunitas.'}},
{id:'s4',cat:'Local Wisdom',type:'Wisdom',icon:'fa-mountain-sun',verified:'Community Verified',g:'linear-gradient(135deg,#0D536B,#45B9AC)',
title:{en:'The Wisdom of Simeulue',id:'Kearifan Simeulue'},
short:{en:'How a small island wove disaster awareness into culture, language, and daily life.',id:'Bagaimana pulau kecil menjalin kesadaran bencana ke budaya, bahasa, dan kehidupan sehari.'},
context:{en:'Simeulue sits off the western coast of Sumatra, exposed to the ocean and its risks. Over centuries, the community developed local wisdom that embeds preparedness into everyday culture.',id:'Simeulue terletak di lepas pantai barat Sumatera, terpapar laut dan risikonya. Selama berabad-abad, masyarakat mengembangkan kearifan lokal yang menanam kesiapsiagaan dalam budaya sehari-hari.'},
story:{en:'Wisdom on Simeulue is practical. Houses were traditionally built above ground; escape routes to the hills were known by heart; the very word "Smong" carried an instruction, not just a description. Preparedness was not a separate lesson — it lived in language, in song, in the layout of the village, and in the authority of elders. This integration of safety into culture is what made the knowledge survive even when modern warning systems were absent.',id:'Kearifan di Simeulue praktis. Rumah tradisional dibangun di atas tanah; rute pelarian ke bukit dihafal; kata "Smong" sendiri membawa instruksi, bukan sekadar deskripsi. Kesiapsiagaan bukan pelajaran terpisah — ia hidup dalam bahasa, lagu, tata desa, dan wibawa tetua. Penyatuan keselamatan ke budaya inilah yang membuat pengetahuan bertahan bahkan saat sistem peringatan modern tak ada.'},
transcript:{en:'"To know Smong is to know the way to the hill before you need it."',id:'"Mengenal Smong berarti mengenal jalan ke bukit sebelum ia diperlukan."'},
source:{en:'Cultural documentation of Simeulue. Sample text for prototype.',id:'Dokumentasi budaya Simeulue. Teks contoh untuk prototipe.'}},
{id:'s5',cat:'Tsunami Preparedness',type:'Guide',icon:'fa-triangle-exclamation',verified:'Demo Content',g:'linear-gradient(135deg,#176F88,#0D536B)',
title:{en:'Smong and Community Preparedness',id:'Smong dan Kesiapsiagaan Komunitas'},
short:{en:'Turning inherited wisdom into clear, actionable tsunami preparedness steps.',id:'Mengubah kearifan warisan menjadi langkah kesiapsiagaan tsunami yang konkret.'},
context:{en:'This guide connects Smong wisdom with official tsunami preparedness guidance so learners can act decisively.',id:'Panduan ini menghubungkan kearifan Smong dengan panduan kesiapsiagaan tsunami resmi agar pembelajar dapat bertindak tegas.'},
story:{en:'Smong gives the core rule: strong shaking + retreating sea = run to high ground immediately. Official guidance agrees: do not wait for an official alert if you feel a long or strong earthquake near the coast. Move quickly to high ground (at least 20 metres above sea level) or move inland away from the shore. Never go to the beach to watch the wave. After the first wave, expect more — stay on high ground until authorities confirm it is safe. Smong and modern preparedness say the same thing: recognize the signs, act fast, help others.',id:'Smong memberi aturan inti: gempa kuat + laut surut = segera lari ke tanah tinggi. Panduan resmi sepakat: jangan tunggu peringatan resmi jika kamu merasakan gempa lama atau kuat di dekat pantai. Cepat pindah ke tanah tinggi (minimal 20 meter di atas permukaan laut) atau menjauh ke pedalaman. Jangan ke pantai menonton ombak. Setelah gelombang pertama, perkirakan gelombang berikutnya — tetap di tanah tinggi hingga otoritas menyatakan aman. Smong dan kesiapsiagaan modern mengatakan hal yang sama: kenali tanda, bertindak cepat, bantu orang lain.'},
transcript:{en:'"If the earth shakes long and the sea pulls back — go up, now. Do not wait. Do not return until told it is safe."',id:'"Jika bumi getar lama dan laut surut — naik, sekarang. Jangan tunda. Jangan kembali sebelum dinyatakan aman."'},
source:{en:'Based on UNESCO/IOC and national disaster-agency tsunami preparedness guidance. Text adapted for this educational prototype.',id:'Berdasarkan panduan kesiapsiagaan tsunami UNESCO/IOC dan badan kebencanaan nasional. Teks disesuaikan untuk prototipe edukasi ini.'}}
];

  sit:{en:"You're spending the afternoon at the beach with your family. Suddenly the ground shakes hard and long. After the shaking stops, you notice the sea has pulled far back, exposing the reef and stranded fish. People start walking toward the exposed sand.",id:"Kamu menghabiskan sore di pantai bersama keluarga. Tiba-tiba tanah getar keras dan lama. Setelah berhenti, kamu perhatikan laut surut jauh, memperlihatkan terumbu dan ikan terdampar. Orang mulai berjalan ke pasir yang terbuka."},

var AI_KB=[
 {keys:['what is smong','apa itu smong'],src:'s1',
  simple:{en:'Smong is local tsunami wisdom inherited by the Simeulue community in Aceh, Indonesia. It teaches that when a strong earthquake is felt and the sea suddenly recedes, a great wave (tsunami) is coming — and everyone must run to high ground immediately.',id:'Smong adalah kearifan tsunami lokal yang diwariskan masyarakat Simeulue di Aceh, Indonesia. Ia mengajarkan bahwa saat gempa kuat terasa dan laut tiba-tiba surut, gelombang besar (tsunami) akan datang — dan semua orang harus segera lari ke tanah tinggi.'},
  deep:{en:'Smong is the local term (Devayan language, Simeulue Island) for tsunami awareness encoded in oral tradition. It bundles three signals — long/strong ground shaking, rapid retreat of the sea, and the certainty that a wave follows — into one action: evacuate uphill without waiting for official notice. During the 2004 Indian Ocean tsunami, this inherited knowledge is widely credited with the remarkably low casualties on Simeulue. Smong is transmitted through stories, chants (Nandong), and elder authority, making preparedness part of culture rather than a separate lesson.',id:'Smong adalah istilah lokal (bahasa Devayan, Pulau Simeulue) untuk kesadaran tsunami yang terkodifikasi dalam tradisi lisan. Ia merangkum tiga sinyal — gempa lama/kuat, surutnya laut secara cepat, dan kepastian gelombang menyusul — menjadi satu tindakan: evakuasi ke atas tanpa menunggu pemberitahuan resmi. Saat tsunami Samudra Hindia 2004, pengetahuan warisan ini banyak dipuji sebagai penyebab rendahnya korban di Simeulue. Smong diturunkan lewat cerita, sahut-sahutan (Nandong), dan wibawa tetua, menjadikan kesiapsiagaan bagian dari budaya, bukan pelajaran terpisah.'},
  story:{en:'Long ago, the elders of Simeulue noticed a pattern: when the earth shook hard and the ocean pulled away from the shore, a terrible wave always followed. They gave this knowledge a name — Smong — and passed it to their children in stories and songs. "When the ground trembles and the sea runs away," they said, "the wave is coming. Run to the hill — now." Generation after generation listened. And when the great wave came in 2004, the people remembered, and many lives were saved.',id:'Dahulu, tetua Simeulue melihat pola: saat bumi getar keras dan laut surut dari pantai, gelombang dahsyat selalu menyusul. Mereka menamai pengetahuan ini — Smong — dan mewariskannya ke anak-anak lewat cerita dan lagu. "Saat bumi getar dan laut lari," mereka bilang, "gelombang datang. Lari ke bukit — sekarang." Tiap generasi mendengarkan. Dan saat gelombang besar datang tahun 2004, masyarakat ingat, dan banyak nyawa terselamatkan.'}},
 {keys:['why is smong important','why important','mengapa smong penting','mengapa penting'],src:'s5',
  simple:{en:'Smong is important because it turns disaster awareness into action that can save lives — instantly, without waiting for technology or official alerts.',id:'Smong penting karena mengubah kesadaran bencana menjadi tindakan yang menyelamatkan nyawa — secara instan, tanpa menunggu teknologi atau peringatan resmi.'},
  deep:{en:'Smong matters on three levels: (1) Survival — it provides an immediate, culturally-trusted trigger to evacuate; (2) Resilience — it embeds preparedness in language and memory so it survives even when modern systems fail; (3) Intergenerational transmission — it is taught by elders and chants, so each generation inherits readiness. In 2004, areas with strong Smong memory on Simeulue saw far fewer casualties than coastlines without such tradition.',id:'Smong penting di tiga tingkat: (1) Keselamatan — pemicu evakuasi yang instan dan dipercaya secara budaya; (2) Ketangguh — menanam kesiapsiagaan dalam bahasa dan memori sehingga bertahan saat sistem modern gagal; (3) Penularan lintas generasi — diajarkan tetua dan sahut-sahutan, sehingga tiap generasi mewarisi kesiapan. Pada 2004, wilayah dengan memori Smong kuat di Simeulue memiliki korban jauh lebih sedikit dibanding pesisir tanpa tradisi semacam itu.'},
  story:{en:'Imagine a child on the beach. The ground shakes. The sea disappears. Without Smong, the child might chase the stranded fish. With Smong, the child runs uphill and calls others. That difference — measured in minutes — is why Smong is important. It is culture that saves lives.',id:'Bayangkan anak di pantai. Bumi getar. Laut menghilang. Tanpa Smong, ia mungkin mengejar ikan terdampar. Dengan Smong, ia lari naik dan memanggil orang lain. Beda itu — dihitung menit — sebab Smong penting. Budaya yang menyelamatkan nyawa.'}},
 {keys:['simple words','explain smong in simple','jelaskan smong','kata sederhana'],src:'s1',
  simple:{en:'Smong means: if the earth shakes hard and the sea goes far out, a big wave is coming. Run to high ground right away. Do not wait.',id:'Smong berarti: jika bumi getar keras dan laut surut jauh, gelombang besar akan datang. Lari ke tanah tinggi segera. Jangan tunda.'},
  deep:{en:'In simple terms: Smong = (strong shaking) + (sea retreats) → run uphill now. Do not wait for a siren, do not go to the beach, do not collect things. Help others come with you. Stay up high until told it is safe.',id:'Sederhananya: Smong = (gempa kuat) + (laut surut) → lari naik sekarang. Jangan tunggu sirene, jangan ke pantai, jangan kumpulkan barang. Ajak orang lain ikut. Tetap di atas sampai dinyatakan aman.'},
  story:{en:'Smong in three words: shake, sea, run. The earth shakes. The sea runs away. You run uphill. That is Smong.',id:'Smong dalam tiga kata: getar, laut, lari. Bumi getar. Laut lari. Kamu lari naik. Itulah Smong.'}},
 {keys:['nandong'],src:'s2',
  simple:{en:'Nandong is a chanted oral tradition in Acehnese and Simeulue culture, used to share news, values, and warnings — including the teachings of Smong — through memorable rhythm.',id:'Nandong adalah tradisi lisan bersahut-sahutan dalam budaya Aceh dan Simeulue, dipakai menyebarkan berita, nilai, dan peringatan — termasuk ajaran Smong — lewat irama yang mudah diingat.'},
  deep:{en:'Nandong is a form of rhythmic chanted expression used to transmit information across generations. Because it is set to a memorable beat and rhyme, knowledge carried in Nandong — including Smong warnings — survives even where literacy and modern communication are absent. A Nandong about Smong names the signs (shaking, retreating sea) and the action (run uphill), turning preparedness into a verse the community never forgets.',id:'Nandong adalah ekspresi sahut-sahutan berirama untuk menularkan informasi lintas generasi. Karena dibalut irama dan rima yang mudah diingat, pengetahuan dalam Nandong — termasuk peringatan Smong — bertahan bahkan saat melek-huruf dan komunikasi modern tidak ada. Nandong tentang Smong menyebut tanda (getaran, laut surut) dan tindakan (lari naik), mengubah kesiapsiagaan jadi bait yang tak pernah dilupakan komunitas.'},
  story:{en:'Before phones and radios, the elders sang. A Nandong about Smong might go: "The earth trembles, the sea departs — Smong is coming, climb the heights." Sung at gatherings, repeated by children, the lesson stuck for life.',id:'Sebelum telepon dan radio, tetua bernyanyi. Nandong tentang Smong mungkin berbunyi: "Bumi getar, laut pergi — Smong datang, naik ke puncak." Dinyanyikan di kumpul, diulang anak-anak, pelajaran melekat seumur hidup.'}},
 {keys:['local wisdom','teach me about local wisdom','kearifan lokal','ajari aku tentang kearifan'],src:'s4',
  simple:{en:'Local wisdom is practical knowledge a community builds over generations from living with their environment. On Simeulue, local wisdom includes Smong (tsunami awareness), house-building above ground, known escape routes, and elder authority.',id:'Kearifan lokal adalah pengetahuan praktis yang dibangun komunitas lintas generasi dari hidup bersama lingkungannya. Di Simeulue, kearifan lokal mencakup Smong (kesadaran tsunami), rumah di atas tanah, rute pelarian yang diketahui, dan wibawa tetua.'},
  deep:{en:'Local wisdom is place-tested knowledge: what a community learns by surviving its environment over time, encoded in language, story, practice, and social structure. On Simeulue this means: the word "Smong" itself carries an instruction; escape routes to the hills are common knowledge; traditional homes sit above ground; and elders hold the authority to teach and warn. Local wisdom is resilient because it does not depend on outside technology — it lives in the community.',id:'Kearifan lokal adalah pengetahuan yang teruji-tempat: apa yang dipelajari komunitas dari bertahan di lingkungannya seiring waktu, terkodifikasi dalam bahasa, cerita, praktik, dan struktur sosial. Di Simeulue ini berarti: kata "Smong" sendiri membawa instruksi; rute ke bukit pengetahuan umum; rumah tradisional di atas tanah; dan tetua memegang wibawa mengajar dan memperingatkan. Kearifan lokal tangguh karena tidak bergantung teknologi luar — ia hidup dalam komunitas.'},
  story:{en:'A grandmother points to the hill behind the village. "That is where we run," she says. She did not learn this in school. She learned it from her grandmother, who learned it from hers. That chain — unbroken — is local wisdom.',id:'Nenek menunjuk bukit di belakang desa. "Ke situ kami lari," katanya. Ia tak belajar ini di sekolah. Ia belajar dari neneknya, yang belajar dari neneknya. Rantai itu — tak terputus — itulah kearifan lokal.'}},

  simple:{en:'Great! Head to Misi Siaga and try a quiz. I suggest starting with "Discover: What is Smong?" to test the basics.',id:'Bagus! Masuk ke Misi Siaga dan coba kuis. Saran saya mulai dari "Mengenal: Apa Itu Smong?" untuk menguji dasar.'},
  deep:{en:'Let us test your knowledge. Go to Misi Siaga → Learning Path and start Level 1. Each quiz gives instant feedback and explanations. You can also try the scenario simulations for decision-making under pressure.',id:'Ayo uji pengetahuanmu. Masuk Misi Siaga → Jalur Belajar dan mulai Level 1. Tiap kuis memberi umpan balik instan dan penjelasan. Kamu juga bisa coba simulasi skenario untuk pengambilan keputusan di bawah tekanan.'},
  story:{en:'',id:''},
  quiz:{en:'Quick check: After a long, strong earthquake near the coast, the sea suddenly pulls back far from the shore. What is the correct Smong action? (Answer: run to high ground immediately.) Open Misi Siaga to try the full quiz.',id:'Cek cepat: Setelah gempa lama dan kuat di dekat pantai, laut tiba-tiba surut jauh. Apa tindakan Smong yang benar? (Jawaban: lari ke tanah tinggi segera.) Buka Misi Siaga untuk mencoba kuis lengkap.'}}

function celebrate(n){
  if(SETTINGS.reduceMotion)return;
  var cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:95';
  cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
  var ctx=cv.getContext('2d');var cols=['#0D536B','#176F88','#45B9AC','#FFC52F','#F49A34','#BCECE5'];
  var P=[],count=n||60;
  for(var i=0;i<count;i++)P.push({x:innerWidth/2+(Math.random()-.5)*140,y:innerHeight/3,vx:(Math.random()-.5)*9,vy:Math.random()*-9-3,g:.25,s:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6});
  var f=0;
  function tick(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(function(p){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r+=.12);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.4);ctx.restore()});f++;if(f<95)requestAnimationFrame(tick);else cv.remove()}
  tick();
}

function aiAnswer(text){
  var q=text.toLowerCase().trim();
  var hit=AI_KB.find(function(k){return k.keys.some(function(kk){return q.indexOf(kk)>=0})});
  var mode=STATE.aiMode;
  var body=hit?(hit[mode]&&L(hit[mode])||L(hit.simple)):'';
  if(!body){body=L(AI_FALLBACK)}
  var html='<div class="msg bot">'+body;
  if(hit&&hit.src){var src=storyById(hit.src);if(src)html+='<div class="src-card" data-story="'+src.id+'"><i class="fas fa-book-open"></i> '+(STATE.lang==='id'?'Jelajahi: ':'Explore: ')+L(src.title)+'</div>'}
  if(hit){html+='<div class="followups">';if(mode==='quiz'){html+='<button data-view="learn">'+t('nav.learn')+'</button>'}else{html+='<button data-follow="'+L(AI_FOLLOW.listen)+'">'+L(AI_FOLLOW.listen)+'</button><button data-follow="'+L(AI_FOLLOW.more)+'">'+L(AI_FOLLOW.more)+'</button><button data-follow="'+L(AI_PROMPTS[5])+'">'+L(AI_FOLLOW.quiz)+'</button>'}html+='</div>'}
  html+='</div>';
  return html;
}

function go(view,params){
  params=params||{};
  var c=$('#content');var html='';
  if(view==='home')html=renderHome();
  else if(view==='archive')html=renderArchive();
  else if(view==='story'){STATE.current.story=params.id;html=renderStory(params.id)}
  else if(view==='learn')html=renderLearn();
  else if(view==='quiz'){STATE.current.quiz=params.ref;html=renderQuiz(params.ref)}
  else if(view==='scenario'){STATE.current.scenario=params.ref;html=renderScenario(params.ref)}
  else if(view==='results')html=renderResults(params);
  else if(view==='teachback')html=renderTeachback();
  else if(view==='contributions')html=renderContributions();
  else if(view==='favorites')html=renderFavorites();
  else if(view==='profile')html=renderProfile();
  else if(view==='settings')html=renderSettings();
  else{html=renderHome();view='home'}
  c.innerHTML=html;CURRENT=view;
  $$('.side-link').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-view')===view)});
  $$('.bottomnav a').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-view')===view)});
  window.scrollTo(0,0);bindView();save();
}
function bindView(){
  $$('#content [data-view]').forEach(function(e){e.addEventListener('click',function(){go(e.getAttribute('data-view'))});if(e.getAttribute('role')==='button'){e.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go(e.getAttribute('data-view'))}})}});
  $$('#content [data-action="open-ai"]').forEach(function(e){e.addEventListener('click',openAI)});
  $$('#content [data-story]').forEach(function(e){e.addEventListener('click',function(ev){if(ev.target.closest('[data-fav]'))return;go('story',{id:e.getAttribute('data-story')})})});
  $$('#content [data-fav]').forEach(function(e){e.addEventListener('click',function(){toggleFav(e.getAttribute('data-fav'))})});
  $$('#content [data-mission]').forEach(function(e){e.addEventListener('click',function(){var k=e.getAttribute('data-kind'),r=e.getAttribute('data-ref');if(k==='quiz')go('quiz',{ref:r});else if(k==='scenario')go('scenario',{ref:r});else if(k==='teachback')go('teachback')})});
  var s=$('#archSearch');if(s)s.addEventListener('input',function(){ARCHIVE_Q=s.value;$$('#content .grid').forEach(function(g){if(g.querySelector('.story-card,.empty'))g.innerHTML=archiveList()})});
  $$('#content [data-cat]').forEach(function(c){c.addEventListener('click',function(){ARCHIVE_CAT=c.getAttribute('data-cat');$$('#content [data-cat]').forEach(function(x){x.classList.toggle('active',x===c)});$$('#content .grid').forEach(function(g){if(g.querySelector('.story-card,.empty'))g.innerHTML=archiveList()})})});
  $$('#content [data-ctype]').forEach(function(c){c.addEventListener('click',function(){TB_TYPE=c.getAttribute('data-ctype');go('teachback')})});
  bindQuiz();bindScenario();bindTeachback();bindSettings();bindAudio();
}

function bindQuiz(){
  $$('#content .opt[data-opt]').forEach(function(o){o.addEventListener('click',function(){
    var q=QUIZZES.find(function(x){return x.id===STATE.current.quiz});if(!q)return;
    if(o.classList.contains('disabled'))return;
    var h=$('#quizHint');if(h)h.style.display='none';
    var i=+o.getAttribute('data-opt');var fb=$('#quizFb');
    if(i===q.ans){
      $$('#content .opt').forEach(function(x){x.classList.add('disabled')});
      o.classList.add('correct');fb.className='quiz-fb show ok';fb.innerHTML='<b><i class="fas fa-circle-check"></i> '+t('quiz.correct')+'</b>'+L(q.exp);vibrate(60);celebrate(30);
      if(STATE.completed.indexOf(q.id)<0){STATE.completed.push(q.id);addXP(20)}
      var nx=$('#quizNext');var nq=QUIZZES[QUIZZES.indexOf(q)+1];
      nx.innerHTML='<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-teal" id="qNext">'+t('quiz.next')+(nq?'':' · '+(STATE.lang==='id'?'Selesai':'Finish'))+'</button><button class="btn btn-ghost" data-view="learn">'+t('quiz.learningPath')+'</button></div>';
      var b=$('#qNext');if(b)b.addEventListener('click',function(){if(nq)go('quiz',{ref:nq.id});else go('results',{score:countCorrect(),total:QUIZZES.length,kind:'quiz'})});
    }else{
      o.classList.add('wrong','disabled');fb.className='quiz-fb show no';fb.innerHTML='<b><i class="fas fa-circle-xmark"></i> '+t('quiz.wrong')+'</b>'+L(q.exp)+' '+(STATE.lang==='id'?'Coba opsi lain.':'Try another option.');vibrate(120);
    }
  })});
  var mc=$('#matchCheck');if(mc)mc.addEventListener('click',function(){
    var q=QUIZZES.find(function(x){return x.id===STATE.current.quiz});if(!q)return;
    var h=$('#quizHint');if(h)h.style.display='none';
    var correct=0;$$('#content [data-match]').forEach(function(sel){var key=sel.getAttribute('data-key');var right=q.pairs.find(function(p){return p[0].en===key})[1].en;if(sel.value===right){correct++;sel.style.borderColor='var(--teal)';sel.style.background='rgba(69,185,172,.12)'}else{sel.style.borderColor='var(--bad)';sel.style.background='rgba(224,85,107,.1)'}})
    var fb=$('#quizFb');var all=correct===q.pairs.length;fb.className='quiz-fb show '+(all?'ok':'no');
    fb.innerHTML='<b>'+(all?'<i class="fas fa-circle-check"></i> '+t('quiz.allCorrect'):'<i class="fas fa-circle-info"></i> '+correct+'/'+q.pairs.length+' '+t('quiz.matched'))+'</b>'+L(q.exp);
    if(all){vibrate(60);celebrate(40)}else{vibrate(80)}
    if(STATE.completed.indexOf(q.id)<0&&all){STATE.completed.push(q.id);addXP(20)}
    var nx=$('#quizNext');nx.innerHTML='<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-teal" id="qNext">'+t('quiz.next')+'</button><button class="btn btn-ghost" data-view="learn">'+t('quiz.learningPath')+'</button></div>';
    var b=$('#qNext');if(b)b.addEventListener('click',function(){var nq=QUIZZES[QUIZZES.indexOf(q)+1];if(nq)go('quiz',{ref:nq.id});else go('results',{score:countCorrect(),total:QUIZZES.length,kind:'quiz'})});
  });
}

    }else{
      o.classList.add('wrong','disabled');vibrate(120);
      fb.className='quiz-fb show no';fb.innerHTML='<b><i class="fas fa-circle-xmark"></i> '+t('sc.riskyChoice')+'</b>'+L(ch.con);
    }
  })});
}
function bindTeachback(){
  var mic=$('#micBtn');if(mic)mic.addEventListener('click',function(){var r=mic.classList.toggle('rec');$('#micNote').innerHTML=r?'<i class="fas fa-circle" style="color:var(--bad)"></i> '+t('tb.recording'):'<i class="fas fa-circle-info"></i> '+t('tb.micNote')});
  var sub=$('#tbSubmit');if(sub)sub.addEventListener('click',function(){if(!$('#tbContent').value.trim()&&!$('#tbReflect').value.trim()){toast(t('toast.addContent'));return}STATE.contributions.unshift({title:$('#tbTitle').value.trim()||(STATE.lang==='id'?'Cerita tanpa judul':'Untitled story'),topic:$('#tbTopic').value,type:TB_TYPE,reflect:$('#tbReflect').value,content:$('#tbContent').value,status:'Submitted',date:new Date().toLocaleDateString()});if(STATE.completed.indexOf('tb-done')<0){STATE.completed.push('tb-done');addXP(40)}save();toast(t('toast.submitted'));go('contributions')});
  var dr=$('#tbDraft');if(dr)dr.addEventListener('click',function(){STATE.contributions.unshift({title:$('#tbTitle').value.trim()||(STATE.lang==='id'?'Draf cerita':'Draft story'),topic:$('#tbTopic').value,type:TB_TYPE,reflect:$('#tbReflect').value,content:$('#tbContent').value,status:'Draft',date:new Date().toLocaleDateString()});save();toast(t('toast.draftSaved'))});
}
function bindSettings(){
  var sync=$('#syncBtn');if(sync)sync.addEventListener('click',function(){STATE.lastSync=new Date().toLocaleString();save();go('settings');toast(t('toast.synced'))});
  var mt=$('#motionToggle');if(mt)mt.addEventListener('click',function(){SETTINGS.reduceMotion=!SETTINGS.reduceMotion;mt.classList.toggle('on')});
  var ot=$('#offlineToggle');if(ot)ot.addEventListener('click',function(){SETTINGS.offlineMode=!SETTINGS.offlineMode;ot.classList.toggle('on');STATE.online=!SETTINGS.offlineMode;save();go('settings')});
  var lb=$('#langBtn');if(lb)lb.addEventListener('click',toggleLang);
  var cb=$('#clearBtn');if(cb)cb.addEventListener('click',function(){if(confirm(t('toast.confirmClear'))){localStorage.removeItem('smong_state');STATE={xp:0,completed:[],badges:[],streak:1,favorites:[],contributions:[],aiMode:'simple',lang:STATE.lang,online:navigator.onLine,lastSync:null,current:{story:null,quiz:0,scenario:null}};go('settings');toast(t('toast.dataCleared'))}});
}
function bindAudio(){
  var pb=$('#playBtn');if(!pb)return;var playing=false,prog=0,timer=null;
  pb.addEventListener('click',function(){playing=!playing;pb.innerHTML='<i class="fas '+(playing?'fa-pause':'fa-play')+'"></i>';if(playing){timer=setInterval(function(){prog=Math.min(100,prog+1.5);$('#audioFill').style.width=prog+'%';var s=Math.round(prog/100*84);$('#apTime').textContent=(STATE.lang==='id'?'Pemain demo':'Demo player')+' · 0:'+String(Math.floor(s/60)).padStart(1,'0')+':'+String(s%60).padStart(2,'0')+' / 1:24';if(prog>=100){clearInterval(timer);playing=false;pb.innerHTML='<i class="fas fa-play"></i>'}},120)}else{clearInterval(timer)}});
  var bar=$('#audioBar');if(bar)bar.addEventListener('click',function(e){var r=bar.getBoundingClientRect();prog=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));$('#audioFill').style.width=prog+'%'});
}

document.addEventListener('DOMContentLoaded',function(){
  load();
  applyStaticI18N();
  $$('.side-link, .bottomnav a, .topbar [data-view]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();go(a.getAttribute('data-view'));$('#sidebar').classList.remove('open')})});
  $('#menuToggle').addEventListener('click',function(){$('#sidebar').classList.toggle('open')});
  $$('.side-ai, .fab').forEach(function(b){b.addEventListener('click',openAI)});
  $('#aiClose').addEventListener('click',closeAI);
  $('#aiSheet').addEventListener('click',function(e){if(e.target===$('#aiSheet'))closeAI()});
  $('#langToggle').addEventListener('click',toggleLang);
  $$('.ai-mode').forEach(function(m){m.addEventListener('click',function(){$$('.ai-mode').forEach(function(x){x.classList.remove('active')});m.classList.add('active');STATE.aiMode=m.getAttribute('data-mode');save()})});
  $('#aiSend').addEventListener('click',function(){aiSend($('#aiInput').value)});
  $('#aiInput').addEventListener('keydown',function(e){if(e.key==='Enter')aiSend($('#aiInput').value)});
  $('#aiBody').addEventListener('click',function(e){var c=e.target.closest('[data-story]');if(c){closeAI();go('story',{id:c.getAttribute('data-story')})}var f=e.target.closest('[data-follow]');if(f){aiSend(f.getAttribute('data-follow'))}var v=e.target.closest('[data-view]');if(v){closeAI();go(v.getAttribute('data-view'))}});
  $('#aiSuggest').addEventListener('click',function(e){var b=e.target.closest('[data-prompt]');if(b)aiSend(b.getAttribute('data-prompt'))});
  window.addEventListener('online',function(){STATE.online=true;save()});
  window.addEventListener('offline',function(){STATE.online=false;save()});
  go('home');
  var splashHidden=false;
  function hideSplash(){var s=document.getElementById('splash');if(s&&!splashHidden){splashHidden=true;s.classList.add('hide');setTimeout(function(){if(s&&s.parentNode)s.remove()},700)}}
  var sl=document.querySelector('.splash-logo');var splashMin=1500,splashMax=4000;
  if(sl){if(sl.complete&&sl.naturalWidth){setTimeout(hideSplash,splashMin)}else{sl.addEventListener('load',function(){setTimeout(hideSplash,splashMin)});sl.addEventListener('error',function(){setTimeout(hideSplash,400)})}}else{setTimeout(hideSplash,splashMin)}
  setTimeout(hideSplash,splashMax); // hard cap: splash never stays longer than splashMax
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
});
</script>
</body>
